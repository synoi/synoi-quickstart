# SynOI Gateway: local setup for the LICENSED product.
#
# Generated by `npx @synoi/start init`. Customize via .env in this directory.
#
# The Gateway is commercial software: a 14-day trial, then Operator or Team.
# The image below is NOT published publicly yet, so `docker compose up` cannot
# pull it today. For a free local install that works now, run
# `npx @synoi/start lite` (@synoi/gateway-lite, Apache-2.0).

services:
  gateway:
    image: ghcr.io/foundationx/synoi-gateway:latest
    container_name: synoi-gateway
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      - SYNOI_DATA_DIR=/data/synoi
      - SYNOI_VAULT_DIR=/data/vault
      - PORT=3000
    volumes:
      - synoi-data:/data/synoi
      - synoi-vault:/data/vault
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  synoi-data:
  synoi-vault:
